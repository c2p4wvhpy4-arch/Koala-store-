<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panier - Koala Store</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="top"><div class="top-inner"><a class="logo" href="/">KOALA <span>STORE</span></a><div style="flex:1"></div><a class="iconbtn" href="/cart.html">🛒<span class="badge-count" data-cart-count>0</span></a></div></header><main class="wrap"><div class="section-title"><h2>Mon panier</h2><a href="/">← Continuer mes achats</a></div><div id="app"></div></main><footer class="footer">© 2026 Koala Store</footer>
<script src="/common.js"></script><script>
function change(k,d){const c=getCart();const x=c.find(i=>i.key===k);if(!x)return;x.qty=Math.max(1,Math.min(10,(x.qty||1)+d));setCart(c);draw()}
function removeItem(k){setCart(getCart().filter(x=>x.key!==k));draw()}
async function checkout(){const c=getCart();const b=document.getElementById("pay");b.disabled=true;b.textContent="Ouverture du paiement…";try{const r=await fetch("/api/create-checkout-session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items:c})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Erreur");location.href=d.url}catch(e){alert(e.message);b.disabled=false;b.textContent="Payer par carte"}}
function draw(){const c=getCart();if(!c.length){app.innerHTML='<div class="empty"><h3>Votre panier est vide</h3><p>Ajoutez quelques articles pour commencer.</p><a class="btn" href="/">Découvrir les produits</a></div>';return}const subtotal=c.reduce((s,x)=>s+x.price*x.qty,0);const shipping=subtotal>=49?0:4.90;const total=subtotal+shipping;app.innerHTML=`<div class="cart-layout"><div class="cart-list">${c.map(x=>`<div class="cart-row"><img src="${x.image}"><div><div class="name">${x.name}</div><div class="meta">${x.color||""} · Taille ${x.size||""}</div><div class="price" style="margin-top:8px">${money(x.price)}</div><button onclick="removeItem('${x.key}')" style="border:0;background:none;padding:8px 0;color:#6b7280">Supprimer</button></div><div class="qty"><button onclick="change('${x.key}',-1)">−</button><b>${x.qty}</b><button onclick="change('${x.key}',1)">+</button></div></div>`).join("")}</div><aside class="summary"><h3>Récapitulatif</h3><div class="sumline"><span>Sous-total</span><b>${money(subtotal)}</b></div><div class="sumline"><span>Livraison</span><b>${shipping?money(shipping):"Offerte"}</b></div><div class="sumline total"><span>Total</span><span>${money(total)}</span></div><p class="meta">Le montant Stripe correspond aux articles. Les frais de livraison peuvent être intégrés ensuite selon votre règle commerciale.</p><button id="pay" class="btn full" onclick="checkout()">Payer par carte</button></aside></div>`}
draw();
</script></body></html>
