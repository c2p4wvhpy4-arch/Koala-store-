<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koala Store</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="top"><div class="top-inner"><a class="logo" href="/">KOALA <span>STORE</span></a><div class="search"><input id="q" placeholder="Rechercher robes, chaussures, accessoires..."><button onclick="search()">⌕</button></div><a class="iconbtn" href="/cart.html">🛒<span class="badge-count" data-cart-count>0</span></a></div></header>
<section class="hero"><div class="hero-box"><div class="hero-copy"><div style="font-weight:700;opacity:.8">NOUVELLE COLLECTION</div><h1>Ton style.<br>Ton panier.</h1><p>Une boutique moderne avec nouveautés, promotions, tailles, couleurs et paiement sécurisé.</p><a class="cta" href="#shop">Découvrir</a></div><div class="hero-side"></div></div></section>
<main class="wrap" id="shop"><div class="section-title"><h2>Nos sélections</h2><div class="chips" id="chips"></div></div><div class="grid" id="grid"></div></main><footer class="footer">© 2026 Koala Store — Paiement sécurisé</footer>
<script src="/common.js"></script><script>
let category="Tous"; const cats=["Tous","Femme","Homme","Chaussures","Accessoires"];
function renderChips(){chips.innerHTML=cats.map(c=>`<button class="chip ${c===category?"active":""}" onclick="pick('${c}')">${c}</button>`).join("")}
async function load(){const u=new URL("/api/products",location.origin);if(category!=="Tous")u.searchParams.set("category",category);const qv=q.value.trim();if(qv)u.searchParams.set("q",qv);const r=await fetch(u);const data=await r.json();grid.innerHTML=data.map(p=>`<a class="card" href="/product.html?id=${p.id}"><div class="pill">${p.badge}</div><div class="photo"><img src="${p.image}" alt=""></div><div class="info"><div class="name">${p.name}</div><div class="meta">${p.category} · ★ ${p.rating}</div><div class="prices"><span class="price">${money(p.price)}</span><span class="old">${money(p.oldPrice)}</span></div></div></a>`).join("")||'<div class="empty">Aucun produit trouvé.</div>'}
function pick(c){category=c;renderChips();load()}function search(){load()}q.addEventListener("keydown",e=>{if(e.key==="Enter")search()});renderChips();load();
</script></body></html>
