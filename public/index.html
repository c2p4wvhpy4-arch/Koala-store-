<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Koala Store</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="bar"><a class="logo" href="/">KOALA STORE</a><a href="/cart.html">🛒 Panier</a></div></header><main class="wrap"><h1>Nouveautés</h1><div class="grid" id="g"></div></main><script src="/common.js"></script><script>fetch("/api/products").then(r=>r.json()).then(ps=>g.innerHTML=ps.map(p=>`<div class="card"><img src="${p.image}"><div class="pad"><b>${p.name}</b><div class="price">${euro(p.price)}</div><button class="btn" onclick='let c=cart(),x=c.find(x=>x.id==${p.id});x?x.qty++:c.push({id:${p.id},name:${JSON.stringify(p.name)},price:${p.price},image:${JSON.stringify(p.image)},qty:1});save(c);alert("Ajouté au panier")'>Ajouter au panier</button></div></div>`).join(""))</script></body></html>
