<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Panier</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="bar"><a class="logo" href="/">KOALA STORE</a><a href="/">Continuer mes achats</a></div></header><main class="wrap"><h1>Mon panier</h1><div class="cart"><div id="items"></div><div class="box pad"><h2>Paiement</h2><div id="total"></div><button class="btn" onclick="stripePay()">💳 Payer par carte Stripe</button><hr style="margin:20px 0;border:0;border-top:1px solid #ddd"><b>Koala Crypto</b><select id="plan"><option value="3">Paiement en 3 fois</option><option value="4">Paiement en 4 fois</option></select><select id="crypto"><option value="BTC">Bitcoin (BTC)</option><option value="ETH">Ethereum (ETH)</option><option value="USDC">USDC</option><option value="USDT">USDT</option></select><button class="btn crypto" onclick="koalaPay()">₿ Payer avec Koala Crypto</button></div></div></main><script src="/common.js"></script><script>
function draw(){let c=cart();items.innerHTML=c.map((x,i)=>`<div class="row"><img src="${x.image}"><div><b>${x.name}</b><div>${euro(x.price)} × ${x.qty}</div><button onclick="let c=cart();c.splice(${i},1);save(c);draw()">Supprimer</button></div></div>`).join("")||"Panier vide";total.innerHTML="<h2>Total : "+euro(c.reduce((s,x)=>s+x.price*x.qty,0))+"</h2>"}
async function stripePay(){let r=await fetch("/api/create-checkout-session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items:cart()})}),d=await r.json();if(!r.ok)return alert(d.error);location.href=d.url}
async function koalaPay(){let r=await fetch("/api/koala-crypto/create-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items:cart(),installmentsCount:Number(plan.value),crypto:crypto.value})}),d=await r.json();if(!r.ok)return alert(d.error);location.href=d.paymentUrl}
draw();</script></body></html>
