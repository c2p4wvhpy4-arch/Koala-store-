<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produit - Koala Store</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="top"><div class="top-inner"><a class="logo" href="/">KOALA <span>STORE</span></a><div style="flex:1"></div><a class="iconbtn" href="/cart.html">🛒<span class="badge-count" data-cart-count>0</span></a></div></header><main class="wrap"><div id="product"></div></main><footer class="footer">© 2026 Koala Store</footer>
<script src="/common.js"></script><script>
let p=null,selSize="",selColor="";
async function init(){const id=new URLSearchParams(location.search).get("id");const r=await fetch("/api/products/"+id);if(!r.ok){product.innerHTML='<div class="empty">Produit introuvable</div>';return}p=await r.json();selSize=p.sizes[0];selColor=p.colors[0];draw()}
function draw(){product.innerHTML=`<div class="product-page"><div class="product-image"><img src="${p.image}"></div><div class="product-info"><div class="meta">${p.category} · ★ ${p.rating}</div><h1>${p.name}</h1><div class="prices"><span class="price" style="font-size:28px">${money(p.price)}</span><span class="old">${money(p.oldPrice)}</span></div><p style="color:#6b7280;line-height:1.6">Article tendance Koala Store. Coupe moderne, sélection disponible en plusieurs tailles et coloris.</p><div class="selectors"><div><div class="selector-label">Couleur : ${selColor}</div><div class="options">${p.colors.map(x=>`<button class="opt ${x===selColor?"selected":""}" onclick="selColor='${x}';draw()">${x}</button>`).join("")}</div></div><div><div class="selector-label">Taille : ${selSize}</div><div class="options">${p.sizes.map(x=>`<button class="opt ${x===selSize?"selected":""}" onclick="selSize='${x}';draw()">${x}</button>`).join("")}</div></div></div><button class="btn full" style="font-size:16px;padding:15px" onclick="addCart({id:p.id,name:p.name,price:p.price,image:p.image,size:selSize,color:selColor})">Ajouter au panier</button><a class="btn secondary full" style="display:block;text-align:center;margin-top:10px" href="/cart.html">Voir mon panier</a></div></div>`}
init();
</script></body></html>
